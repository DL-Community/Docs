    <script>
        (function () {
            var storedTheme;
            try {
                storedTheme = localStorage.getItem('dlce-docs-theme');
            } catch (error) {
                storedTheme = null;
            }
            var themeMode = ['auto', 'light', 'dark'].indexOf(storedTheme) !== -1 ? storedTheme : 'auto';
            var theme = themeMode === 'auto'
                ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
                : themeMode;
            document.documentElement.dataset.themeMode = themeMode;
            document.documentElement.dataset.theme = theme;

            var legacyLanguage = location.hash.match(/^#\/(?:zh|zh-Hans|zh-cn)(?=\/|$)(.*)$/i);
            if (legacyLanguage) {
                location.replace('#' + (legacyLanguage[1] || '/'));
            }
        })();
    </script>

    <link rel="stylesheet" href="lib/css/theme-simple.css">
    <link rel="stylesheet" href="lib/css/styles.css">

    <link id="prism-dark-theme" rel="stylesheet" href="lib/css/prism-dark.css">
    <link rel="stylesheet" href="lib/css/docsify-tabs.css">
    <link rel="stylesheet" href="lib/css/docs-app.css?v=43">

    <script>
        (function () {
            var dark = document.documentElement.dataset.theme === 'dark';
            document.getElementById('prism-light-theme').media = dark ? 'not all' : 'all';
            document.getElementById('prism-dark-theme').media = dark ? 'all' : 'not all';
        })();
    </script>
</head>

<body>
<!--
THESIS: Give the existing Docsify wiki Docusaurus-grade wayfinding without changing its content engine or URLs.
OWN-WORLD: Restrained graphite surfaces, the established #2c9cff blue, crisp dividers, and dense documentation controls.
STORY: Readers choose a major area in the top bar, navigate its collapsible tree at left, then read without losing context.
FIRST VIEWPORT: A 64px global header spans the page; brand and section tabs lead, utilities close it, and the current section tree anchors the left rail.
FORM: Docusaurus-inspired documentation shell, directly specified by the user; seed key user-pinned-docusaurus-docsify.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->

        </button>
    </div>
</header>

<div class="mobile-sidebar-shadow" aria-hidden="true"></div>
<div class="center" id="app">Loading...</div>

<script>
    var zhUI = window.DLCE_I18N.zh;
    var enUI = window.DLCE_I18N.en;
    window.$docsify = {
        basePath: '/Docs/',
        toc: {
            tocMaxLevel: 5,
            target: 'h1, h2, h3, h4, h5, h6',
            ignoreHeaders: ['<!-- {docsify-ignore} -->', '<!-- {docsify-ignore-all} -->']
        },
        alias: {
            '/': '/about/home',
            '/about/': '/about/home',
            '/dlce/': '/dlce/contents',
            '/social/': '/social/home',
            '/legal/': '/legal/eula',
            '/dlce/about': '/about/home',
            '/en/': 'en/about/home',
            '/en/about/': '/en/about/home',
            '/en/dlce/': '/en/dlce/contents',
            '/en/social/': '/en/social/home',
            '/en/legal/': '/en/legal/eula',
            '/en/dlce/about': 'en/about/home',

            '/404': '/_404.md',
            '/en/404': '/en/_404.md',
            '/en': '/en/',
            '/dlce/eula': '/legal/eula',
            '/dlce/privacy': '/legal/privacy',
            '/dlce/open-source': '/legal/open-source',
            '/en/dlce/eula': '/en/legal/eula',
            '/en/dlce/privacy': '/en/legal/privacy',
            '/en/dlce/open-source': '/en/legal/open-source',
            '/dlce/custom_post_processing': '/dlce/custom-post-processing/home',
            '/dlce/custom_post_processing_v2': '/dlce/custom-post-processing/v2',
            '/dlce/custom_post_processing_v1': '/dlce/custom-post-processing/v1',
            '/dlce/custom_post_processing_legacy': '/dlce/custom-post-processing/legacy'
        },
        name: '',
        homepage: 'home.md',
        loadSidebar: true,
        loadNavbar: true,
        maxLevel: 0,
        subMaxLevel: 2,
        topMargin: 76,
        notFoundPage: {
            '/': '/404',
            '/en/': '/en/404'
        },
        auto2top: true,
        fallbackLanguages: ['/', '/en'],
        search: {
            maxAge: 86400000,
            paths: 'auto',
            placeholder: {
                '/en': enUI.search_placeholder,
                '/': zhUI.search_placeholder
            },
            noData: {
                '/en': enUI.search_no_results,
                '/': zhUI.search_no_results
            },
            depth: 4,
            hideOtherSidebarContent: true,
            pathNamespaces: ['/', '/en'],
            namespace: '/Docs'
        },
        tabs: {
            sync: true,
            theme: 'material',
            tabComments: true
        },
        pagination: {
            previousText: {
                '/en/': enUI.pagination_previous,
                '/': zhUI.pagination_previous
            },
            nextText: {
                '/en/': enUI.pagination_next,
                '/': zhUI.pagination_next
            },
            crossChapter: true,
            crossChapterText: true
        }
    };
</script>
