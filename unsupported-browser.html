<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浏览器需要升级｜跳舞的线：社区版 Wiki</title>
    <link rel="icon" href="lib/img/favicon/dark.png" type="image/png">
    <link rel="stylesheet" href="lib/css/unsupported-browser.css?v=1">
</head>
<body>
    <div class="legacy-browser-page" role="main">
        <div class="legacy-browser-center">
            <div class="legacy-browser-content">
                <div class="legacy-browser-header">
                    <img class="legacy-browser-logo" src="lib/img/dlce.png" alt="">
                    <h1>当前浏览器已经过时</h1>
                    <p class="legacy-browser-intro">这个浏览器缺少网站需要的安全更新和网页功能。请升级浏览器或操作系统，然后再访问跳舞的线：社区版 Wiki。</p>
                </div>

                <h2>推荐使用</h2>
                <ul class="browser-list">
                    <li><a href="https://www.microsoft.com/edge/download" target="_blank" rel="noopener noreferrer">Microsoft Edge</a></li>
                    <li><a href="https://www.google.com/chrome/" target="_blank" rel="noopener noreferrer">Google Chrome</a></li>
                    <li><a href="https://www.mozilla.org/firefox/new/" target="_blank" rel="noopener noreferrer">Mozilla Firefox</a></li>
                    <li><a href="https://support.apple.com/HT204416" target="_blank" rel="noopener noreferrer">Apple Safari</a></li>
                </ul>

                <div class="legacy-browser-actions">
                    <a id="legacy-browser-continue" class="legacy-browser-continue" href="./">忽略并继续浏览</a>
                    <p class="legacy-browser-caution">继续后，部分页面、搜索或导航功能可能无法正常工作。此选择只在当前浏览器会话内生效。</p>
                </div>

                <p id="legacy-browser-languages" class="legacy-browser-languages" aria-label="选择语言">
                    <a href="unsupported-browser.html" data-language-path="" lang="zh-CN" aria-current="page">简体中文</a>
                    <a href="zh-TW/unsupported-browser.html" data-language-path="zh-TW/" lang="zh-TW">繁體中文</a>
                    <a href="en/unsupported-browser.html" data-language-path="en/" lang="en">English</a>
                </p>
            </div>
        </div>
    </div>
    <script src="lib/supported-languages.js?v=1"></script>
    <script id="legacy-browser-page-script" data-language-code="zh" src="lib/legacy-browser-page.js?v=1"></script>
</body>
</html>
